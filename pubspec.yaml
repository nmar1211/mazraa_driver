name: mazraa_driver
description: "تطبيق مزرعتي الاحترافي للسائقين ومندوبي التوصيل."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  geolocator: ^14.0.1
  go_router: ^15.1.2
  google_maps_flutter: ^2.12.2
  intl: ^0.20.2
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/illustrations/
    - assets/maps/
    - assets/decorations/
    # Runtime-sized derivatives of the exact ASSET_INDEX artwork. Original
    # reference PNG files remain untouched under refrinces/assets_primary/.
    - assets/reference_runtime/
    # Screen 03 uses this canonical reference layer directly because the old
    # runtime alias incorrectly pointed at asset_route_map_pin_cluster.
    - refrinces/assets_primary/by_screen/03/01_asset_home_route_dashboard.png
    # Screen 04 crops its four card photos, logo and driver portrait directly
    # from the canonical reference. No substitute/generated artwork is used.
    - refrinces/screens/04_orders_list.png
